# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# also derived from https://github.com/we-cli/coverage-badge-action
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

name: test-coverage-local

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::DT
            any::htmltools
          needs: coverage

      - name: Cache C++ and R dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R
            ~/.local/share/R
          key: dependencies-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            dependencies-${{ runner.os }}-

      - name: Test coverage
        run: |
          Rscript ${{ github.workspace }}/.github/workflows/test-coverage.R ${{ runner.temp }} ${{ github.workspace }}
        shell: bash

      - name: Show testthat.Rout output in logs
        if: always()
        run: |
          echo "Looking for testthat.Rout files..."
          find ${{ runner.temp }} -type f -name 'testthat.Rout' | while read file; do
            echo "::group::Contents of $file"
            cat "$file"
            echo "::endgroup::"
          done
        shell: bash

      - name: Upload workspace dump as artifact if the test fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: ${{ runner.temp }}/package/**/testthat.Rout*

      - name: Get Values
        id: get-values
        shell: bash
        run: |
          COV=$(cat ${{ github.workspace }}/local_cov.Rout)
          echo "Patch coverage: $COV"
          echo "coverage=$COV" >> $GITHUB_OUTPUT

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Patch comparison
        id: patch-comparison
        shell: bash
        env:
          COV_PATCH: ${{ steps.get-values.outputs.coverage }}
        run: |
          cov_patch="$COV_PATCH"
          cov_current=0

          if [[ -f cov_current.Rout ]]; then
            cov_current=$(cat cov_current.Rout)
          fi

          # Require valid coverage percentages.
          for value in "$cov_patch" "$cov_current"; do
            if [[ ! "$value" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
               (( $(echo "$value > 100" | bc -l) )); then
              echo "::error::Invalid coverage value: '$value'"
              exit 1
            fi
          done

          # Allow a decrease of up to 5 percentage points.
          tolerance=5
          cov_floor=$(echo "$cov_current - $tolerance" | bc -l)
          if (( $(echo "$cov_floor < 0" | bc -l) )); then
            cov_floor=0
          fi

          echo "Current coverage: $cov_current%"
          echo "Patch coverage: $cov_patch%"
          echo "Minimum allowed coverage: $cov_floor%"

          if (( $(echo "$cov_patch >= $cov_current" | bc -l) )); then
            echo "Coverage maintained or improved."
            cov_update="$cov_patch"
          elif (( $(echo "$cov_patch >= $cov_floor" | bc -l) )); then
            echo "::warning::Coverage decreased within the allowed $tolerance percentage points."
            # Preserve the baseline to prevent cumulative decreases.
            cov_update="$cov_current"
          else
            echo "::error::Coverage ($cov_patch%) is below the allowed floor ($cov_floor%)."
            exit 1
          fi

          echo "cov_update=$cov_update" >> "$GITHUB_OUTPUT"

      - name: Overwrite cov_current.Rout
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          cov_update="${{ steps.patch-comparison.outputs.cov_update }}"
          touch cov_current.Rout
          echo "$cov_update" > cov_current.Rout

      - name: Create Badges
        shell: bash
        run: |
          npm i -g badgen-cli
          export COV=${{ steps.get-values.outputs.coverage }}
          COLOR=$(node -p '+process.env.COV >= 95 ? `green` : `yellow`')
          mkdir -p badges
          badgen -j coverage -s $COV% -c $COLOR > badges/coverage.svg
  
      - name: Deploy Badges
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update badges [skip ci] & cov_current.Rout"
          branch: gh-pages
          skip_fetch: true
          skip_checkout: true
  
      # Without this, will get Error:
      # Can't find 'action.yml', 'action.yaml' or 'Dockerfile' under '/home/runner/work/coverage-badge-action/coverage-badge-action/action.yml'.
      # Did you forget to run actions/checkout before running your local action?
      - name: Checkout Back
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  
