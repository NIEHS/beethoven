name: beethoven-conda-env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ---- Core R ----
  - r-base=4.5.2

  # ---- GIS / Spatial (pinned — pipeline correctness depends on these) ----
  - r-sf=1.0_24
  - r-terra=1.8_93
  - gdal=3.12.1
  - geos=3.14.1
  - proj=9.7.1
  - libgdal-hdf4=3.12.1
  - libgdal-hdf5=3.12.1

  # ---- Data ----
  - r-dplyr
  - r-data.table
  - r-lubridate
  - r-arrow
  - r-visnetwork

  # ---- Workflow / HPC ----
  - r-targets
  - r-tarchetypes
  - r-crew
  # r-crew.cluster: conda version; r_package_install.sh overrides with dev build
  - r-crew.cluster
  - r-rdpack
  - r-mirai
  - r-nanonext
  - r-qs2

  # ---- Modeling / ML ----
  - r-parsnip
  - r-bonsai
  - r-dials
  - r-lightgbm
  - r-xgboost
  - r-mgcv
  - r-glmnet
  - r-finetune
  - r-spatialsample
  - r-tidymodels
  - r-tidyverse
  - r-workflows

  # ---- DESCRIPTION Imports (conda-available) ----
  - r-collapse
  - r-tigris
  - r-scatterplot3d
  - r-parallelly
  - r-butcher
  - r-recipes
  - r-rsample
  - r-tune
  - r-rlang
  - r-tibble
  - r-tidyr
  - r-tidyselect
  - r-yardstick
  - r-stringi
  - r-purrr
  - r-magrittr

  # ---- Dev / Build tooling ----
  - r-devtools
  - r-pak
  - r-rcpp

  # ---- Build / compilers ----
  - compilers
  - make
  - pkg-config

  # ---- Tooling ----
  - quarto
